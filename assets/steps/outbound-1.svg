<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
     aria-label="The portal sidebar with Assistants highlighted under the Build group.">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D3BEE" /><stop offset="1" stop-color="#A855F7" />
    </linearGradient>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B1230" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="#FBF9FC" />
  <g filter="url(#s1)">
    <rect x="36" y="28" width="568" height="304" rx="14" fill="#fff" />
  </g>

  <!-- sidebar -->
  <rect x="36" y="28" width="150" height="304" rx="14" fill="#F7F4FA" />
  <rect x="36" y="28" width="14" height="304" fill="#F7F4FA" />
  <circle cx="62" cy="56" r="9" fill="url(#g1)" />
  <rect x="78" y="51" width="58" height="9" rx="4.5" fill="#DDD6E6" />

  <rect x="56" y="88" width="34" height="7" rx="3.5" fill="#C9C1D6" />
  <rect x="56" y="110" width="70" height="8" rx="4" fill="#DDD6E6" />
  <rect x="56" y="132" width="58" height="8" rx="4" fill="#DDD6E6" />
  <rect x="56" y="154" width="66" height="8" rx="4" fill="#DDD6E6" />

  <rect x="56" y="186" width="30" height="7" rx="3.5" fill="#C9C1D6" />

  <!-- the target: Assistants -->
  <rect x="46" y="204" width="130" height="30" rx="8" fill="#F1ECFE" />
  <rect x="46" y="204" width="3" height="30" rx="1.5" fill="url(#g1)" />
  <rect x="62" y="215" width="72" height="9" rx="4.5" fill="#6D3BEE" />
  <rect x="46" y="204" width="130" height="30" rx="8" fill="none" stroke="url(#g1)" stroke-width="1.5" />

  <rect x="56" y="248" width="62" height="8" rx="4" fill="#DDD6E6" />
  <rect x="56" y="270" width="54" height="8" rx="4" fill="#DDD6E6" />
  <rect x="56" y="292" width="70" height="8" rx="4" fill="#DDD6E6" />

  <!-- content area, deliberately vague: the sidebar is the subject -->
  <rect x="212" y="60" width="120" height="12" rx="6" fill="#E7E1EE" />
  <rect x="212" y="96" width="352" height="52" rx="10" fill="#F7F4FA" />
  <rect x="212" y="160" width="352" height="52" rx="10" fill="#F7F4FA" />
  <rect x="212" y="224" width="352" height="52" rx="10" fill="#F7F4FA" />

  <!-- callout -->
  <circle cx="196" cy="219" r="15" fill="url(#g1)" opacity="0.16" />
  <circle cx="196" cy="219" r="7" fill="url(#g1)" />
</svg>
