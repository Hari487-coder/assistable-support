<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistable Support</title>
    <meta name="description" content="Assistable guides, support docs, community, and human support." />
    <link rel="icon" href="assets/brand/assistable-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="wash" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <img src="assets/brand/assistable-mark.png" alt="" class="mark" />
        <span class="brandname">Assistable <span class="brandname-thin">Support</span></span>
      </div>
      <span class="status">
        <span class="status-dot" aria-hidden="true"></span>
        Support is open
      </span>
    </header>

    <main id="hub" aria-label="Assistable support"></main>

    <footer class="foot">
      <p>Contact the Assistable support team by email.</p>
    </footer>

    <!-- Content, then the components that render it. -->
    <script src="assets/walkthroughs.js"></script>
    <script src="assets/docs.js"></script>
    <script src="assets/docs-site.js"></script>
    <script type="module">
      import { SupportHub } from "./assets/hub.js";
      SupportHub(document.getElementById("hub"));
    </script>

  </body>
</html>
