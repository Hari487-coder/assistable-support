<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistable Support</title>
    <link rel="icon" href="assets/brand/assistable-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="canvas" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <img src="assets/brand/assistable-mark.png" alt="" class="mark" />
        <span class="brandname">Assistable <span class="brandname-thin">Support</span></span>
      </div>
      <span class="status">
        <span class="status-dot" aria-hidden="true"></span>
        Support is open
      </span>
    </header>

    <main>
      <section class="console" id="console">
        <!-- DOORS: the one decision, made obvious -->
        <div class="view" id="viewDoors">
          <h1>What do you need?</h1>

          <div class="doors">
            <button class="door door-answer" id="doorAnswer" type="button">
              <span class="door-art" aria-hidden="true">
                <svg viewBox="0 0 72 72" width="68" height="68">
                  <defs>
                    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0" stop-color="#7A3FE4" /><stop offset="1" stop-color="#57C9D6" />
                    </linearGradient>
                    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
                      <feDropShadow dx="0" dy="3" stdDeviation="3.5"
                                    flood-color="#1B1230" flood-opacity="0.16" />
                    </filter>
                  </defs>

                  <circle cx="36" cy="34" r="27" fill="url(#cool)" opacity="0.12" />

                  <!-- the screen you are being shown -->
                  <g filter="url(#lift)">
                    <rect x="13" y="15" width="46" height="34" rx="7" fill="#fff" />
                  </g>
                  <rect x="13" y="15" width="15" height="34" rx="7" fill="url(#cool)" opacity="0.18" />
                  <rect x="13" y="15" width="46" height="34" rx="7" fill="none"
                        stroke="url(#cool)" stroke-width="1.6" opacity="0.5" />

                  <!-- the one row being pointed at -->
                  <rect x="17" y="29" width="7" height="4" rx="2" fill="url(#cool)" />
                  <rect x="33" y="22" width="21" height="4" rx="2" fill="url(#cool)" opacity="0.28" />
                  <rect x="33" y="30" width="17" height="4.5" rx="2.25" fill="url(#cool)" />
                  <rect x="33" y="39" width="21" height="4" rx="2" fill="url(#cool)" opacity="0.28" />

                  <!-- pointer -->
                  <path d="M47 34l11 5-4.6 1.6L51 45.4z" fill="#fff" stroke="url(#cool)"
                        stroke-width="2" stroke-linejoin="round" />

                  <!-- steps -->
                  <circle cx="27" cy="59" r="3.6" fill="url(#cool)" />
                  <circle cx="36" cy="59" r="3.6" fill="url(#cool)" opacity="0.5" />
                  <circle cx="45" cy="59" r="3.6" fill="url(#cool)" opacity="0.25" />
                </svg>
              </span>
              <span class="door-title">Show me how</span>
              <span class="door-body">See it done, screen by screen</span>
            </button>

            <button class="door door-debug" id="doorDebug" type="button">
              <span class="door-art" aria-hidden="true">
                <svg viewBox="0 0 72 72" width="68" height="68">
                  <defs>
                    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0" stop-color="#F0257A" /><stop offset="1" stop-color="#FBA94C" />
                    </linearGradient>
                  </defs>

                  <circle cx="36" cy="34" r="27" fill="url(#warm)" opacity="0.12" />

                  <!-- your account, same card as the other door -->
                  <g filter="url(#lift)">
                    <rect x="13" y="15" width="46" height="34" rx="7" fill="#fff" />
                  </g>
                  <rect x="13" y="15" width="46" height="34" rx="7" fill="none"
                        stroke="url(#warm)" stroke-width="1.6" opacity="0.5" />

                  <!-- what we read inside it -->
                  <path d="M19 33h5l3.5-8 5 16 4-11 2.5 3h6"
                        fill="none" stroke="url(#warm)" stroke-width="2.6"
                        stroke-linecap="round" stroke-linejoin="round" />

                  <!-- the instrument -->
                  <circle cx="47" cy="45" r="12" fill="#fff" />
                  <circle cx="47" cy="45" r="9.5" fill="none" stroke="url(#warm)" stroke-width="2.6" />
                  <path d="M54 52l5.5 5.5" stroke="url(#warm)" stroke-width="3.2" stroke-linecap="round" />
                  <path d="M47 41v8M43 45h8" stroke="url(#warm)" stroke-width="2.2" stroke-linecap="round" />
                </svg>
              </span>
              <span class="door-title">Something is broken</span>
              <span class="door-body">Send it over. We go into your account and fix it</span>
            </button>
          </div>
        </div>

        <!-- ASK (answer bot) -->
        <div class="view" id="viewAsk" hidden>
          <div class="view-top">
            <button class="back-link" id="askBack" type="button">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2"
                      stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              Back
            </button>
            <span class="pill pill-answer">Answer bot</span>
          </div>

          <h2 class="ask-h">What do you want to do?</h2>

          <div class="prompt">
            <input id="ask" type="text" autocomplete="off" placeholder="I want to&hellip;"
                   aria-label="What do you want to do?" />
            <button class="send" id="send" type="button" aria-label="Find the walkthrough">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor"
                      stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>

          <div class="chips" id="chips"></div>

          <p class="miss" id="miss" hidden>
            No guide for that yet.
            <button class="linkish" type="button" id="missToBot">Ask support</button>
          </p>
        </div>

        <!-- WALKTHROUGH -->
        <div class="view" id="viewPlay" hidden>
          <div class="play-top">
            <button class="back-link" id="exit" type="button">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2"
                      stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              All help
            </button>
            <h2 id="wtTitle"></h2>
            <span class="counter" id="counter"></span>
          </div>

          <ol class="rail" id="rail" aria-label="Progress"></ol>

          <div class="stage" id="stage">
            <figure class="art"><img id="art" alt="" /></figure>
            <div class="say">
              <h3 id="stepTitle"></h3>
              <p id="stepBody"></p>
            </div>
          </div>

          <div class="play-foot">
            <button class="btn ghost" id="prev" type="button">Back</button>
            <div class="foot-right">
              <button class="btn quiet" id="stuck" type="button">This did not work</button>
              <button class="btn primary" id="nextBtn" type="button">Next step</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="foot">
      <p>Support never changes your account without a person looking first.</p>
    </footer>

    <script src="assets/walkthroughs.js"></script>
    <script src="assets/app.js"></script>

    <script
      src="https://createassistants.com/chat-widget-v2.js"
      data-widget-id="cmszqztj7002fjo041eh3wdfj"
      data-assistant-id="cmszqyxhm0001l304kula1ga7"
      data-account-id="1753298396627x629167684234041700"
      data-assistant-name="Assistable Support"
      data-position="bottom-right"
      data-auto-open="false"
      data-show-prompt="true"
    ></script>
  </body>
</html>
