<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistable Support</title>
    <meta name="description" content="Guides, help docs and the Assistable community. Whatever you need, start here." />
    <link rel="icon" href="assets/brand/assistable-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="wash" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <img src="assets/brand/assistable-mark.png" alt="" class="mark" />
        <span class="brandname">Assistable <span class="brandname-thin">Support</span></span>
      </div>
      <span class="status">
        <span class="status-dot" aria-hidden="true"></span>
        Support is open
      </span>
    </header>

    <main id="hub" aria-label="Assistable support"></main>

    <footer class="foot">
      <p>Every fix is made by a real engineer, in your real account. Never a script.</p>
    </footer>

    <!-- Content, then the components that render it. -->
    <script src="assets/walkthroughs.js"></script>
    <script src="assets/docs.js"></script>
    <script type="module">
      import { SupportHub } from "./assets/hub.js";
      SupportHub(document.getElementById("hub"));
    </script>

    <!--
      The Assistable v2 chat widget (CHAT_WIDGET_V2), created from the support
      help desk template. Appearance, home actions, tabs and help articles live
      on the widget record in the portal.

      Untouched by the hub redesign on purpose. This is the route that ends with
      an engineer inside the customer's account, it was working before, and the
      hub only borrows its launcher.

      These attributes are the ones the record cannot carry:

      pre-chat form  identity, collected before the chat opens. On v2 this is
                     driven from the embed, so without it {{contact.email}} is
                     empty and the assistant asks for an address it already has.
      bug-report     off deliberately. The built-in report posts to Assistable's
                     own channel, so it never reaches the intake assistant and
                     never becomes a ticket anyone works.
    -->
    <script
      src="https://createassistants.com/chat-widget-v2.js"
      data-widget-id="cmt041ugd000hhz0axeybqqh2"
      data-assistant-id="cmszqyxhm0001l304kula1ga7"
      data-account-id="1753298396627x629167684234041700"
      data-assistant-name="Assistable Support"
      data-position="bottom-right"
      data-theme="light"
      data-auto-open="false"
      data-require-pre-chat-form="true"
      data-pre-chat-fields="name,email"
      data-pre-chat-heading="Before we open your account"
      data-pre-chat-subheading="We need the email on your Assistable account so we know it is you."
      data-show-prompt="true"
      data-prompt-message="Something not working? Tell us what happened."
      data-teaser-greeting="Stuck on something?"
      data-handoff-mode="support"
      data-enable-memory="true"
      data-notification-sound="true"
      data-bug-report="false"
    ></script>
  </body>
</html>
